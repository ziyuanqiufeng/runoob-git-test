name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # 关键：GitHub runner 无显示环境，PySide6 的 QApplication 必须走 offscreen 插件，
    # 否则任何 UI 测试会因缺少 X display 直接崩溃。本地无头验证同样需要此变量。
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system libs for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon0 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage

      - name: Validate configs (pre-flight, fast fail on JSON typo)
        run: python tools/validate_configs.py

      - name: Run pytest (correctness gate)
        run: python -m pytest tests/ -q

      - name: Run checks + balance simulation (perf gate ≤2s, zero errors)
        run: python tools/run_checks.py --quick

      - name: Balance audit (informational; trend tracking via artifact)
        run: python tools/balance_audit.py --months 120 --json balance_audit_summary.json

      - name: Upload balance audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-audit
          path: balance_audit_summary.json
